services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientflow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-clientflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientflow} -d ${POSTGRES_DB:-clientflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: clientflow.settings.development
      SECRET_KEY: django-insecure-change-me
      DB_NAME: ${POSTGRES_DB:-clientflow_dev}
      DB_USER: ${POSTGRES_USER:-clientflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clientflow}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
    command: celery -A clientflow worker --loglevel=info
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: clientflow.settings.development
      SECRET_KEY: django-insecure-change-me
      DB_NAME: ${POSTGRES_DB:-clientflow_dev}
      DB_USER: ${POSTGRES_USER:-clientflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clientflow}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    command: celery -A clientflow beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://127.0.0.1:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
